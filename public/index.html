<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak It! - AI Voice Canvas</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @font-face { 
            font-family: 'Neon80s'; 
            src: url('https://res.cloudinary.com/dzasncxfn/raw/upload/v1759932430/Neon80s_dwg7ti.ttf'); 
        }
        .font-neon { font-family: 'Neon80s', cursive; }
        
        @keyframes neonCycle {
            0%, 100% { color: #22d3ee; }
            20% { color: #f472b6; }
            40% { color: #fbbf24; }
            60% { color: #a855f7; }
            80% { color: #4ade80; }
        }
        .neon-letter { animation: neonCycle 5s infinite linear; text-shadow: 0 0 15px currentColor; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        @keyframes emergencyGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); border-color: rgba(239, 68, 68, 0.5); transform: scale(1); }
            50% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.9); border-color: rgba(239, 68, 68, 1); transform: scale(1.1); }
        }
        .animate-emergency { animation: emergencyGlow 1.2s infinite ease-in-out; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .timeline-scroll::-webkit-scrollbar { height: 8px; }
        .timeline-scroll::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); border-radius: 10px; }
        .timeline-scroll::-webkit-scrollbar-thumb { background: rgba(37, 99, 235, 0.3); border-radius: 10px; }
        
        input[type="range"] { -webkit-appearance: none; background: transparent; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px; width: 18px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            border: 4px solid white;
            box-shadow: 0 5px 15px rgba(37,99,235,0.4);
            margin-top: -8px;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 2px;
        }

        #playhead { transition: none !important; will-change: left; }
        .glass-panel { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .glass-card { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        @keyframes apiKeyAttention {
            0%, 100% {
                transform: scale(0.97);
                border-color: #22d3ee;
                box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.16), 0 0 12px rgba(34, 211, 238, 0.45);
            }
            50% {
                transform: scale(1.035);
                border-color: #a855f7;
                box-shadow: 0 0 0 6px rgba(168, 85, 247, 0.12), 0 0 24px rgba(168, 85, 247, 0.6);
            }
        }
        .api-key-attention {
            animation: apiKeyAttention 2.4s ease-in-out infinite;
            transform-origin: center;
        }
        .api-key-attention:focus {
            animation: none;
            transform: scale(1);
            border-color: #22d3ee;
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2), 0 0 18px rgba(34, 211, 238, 0.45);
        }
        @keyframes apiLinkArrow {
            0%, 100% { transform: translateX(-4px); }
            50% { transform: translateX(3px); }
        }
        .api-link-arrow {
            flex-shrink: 0;
            color: #2563eb;
            filter: drop-shadow(0 0 4px rgba(34, 211, 238, 0.55));
            animation: apiLinkArrow 1.3s ease-in-out infinite;
        }
        @media (prefers-reduced-motion: reduce) {
            .api-link-arrow { animation: none; }
            .api-key-attention {
                animation: none;
                border-color: #22d3ee;
                box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2), 0 0 18px rgba(34, 211, 238, 0.45);
            }
        }
    </style>
</head>
<body class="h-screen w-screen m-0 p-0 overflow-hidden bg-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback, useMemo } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                play: <path d="m5 3 14 9-14 9V3z" />,
                pause: <><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></>,
                download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3" />,
                trash: <><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /></>,
                clock: <><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></>,
                mic: <><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2" /><line x1="12" y1="19" x2="12" y2="22" /></>,
                check: <polyline points="20 6 9 17 4 12" />,
                waves: <path d="M2 12s3-4 5-4 5 4 8 4 5-4 7-4" />,
                loader: <path d="M21 12a9 9 0 1 1-6.21-8.58" />,
                alert: <><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></>,
                key: <path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4M15.5 7.5l-6 6M9.5 13.5 4 19M9.5 13.5l-1.5-1.5M4 19l-2 3" />,
                external: <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6m4-3h6v6m-11 5L21 3" />,
                x: <><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></>,
                zoomIn: <><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /><line x1="11" y1="8" x2="11" y2="14" /><line x1="8" y1="11" x2="14" y2="11" /></>,
                zoomOut: <><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /><line x1="11" y1="8" x2="11" y2="14" /><line x1="8" y1="11" x2="14" y2="11" /></>,
                refresh: <><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" /><path d="M16 16h5v5" /></>
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className + (name === 'loader' ? ' animate-spin' : '')}>
                    {icons[name]}
                </svg>
            );
        };

        const MODEL_ID = "gemini-2.5-flash-preview-tts";
        const FREE_VERSION_URL = window.location.protocol === "file:" ? "http://127.0.0.1:4318/" : "/free/";
        const STYLES_LIST = ["(Default)", "Welcoming", "Angry", "Cheerful", "Sad", "Excited", "Friendly", "Hopeful", "Unfriendly", "Whispering", "Shouting", "Terrified"];

        const TRANSLATIONS = {
            eng: {
                freeVersion: "Free Version",
                apiKeyLabel: "Personal API Key",
                apiKeyLink: "Get API Key (Google AI Studio)",
                apiKeyPlaceholder: "Paste your Free Tier key here...",
                keyRequired: "Enter your personal Gemini API key first.",
                voice1: "Voice 1",
                voice2: "Voice 2",
                style: "Style",
                speed: "Speed",
                pauseHint: "Add (pause 2 seconds) or (pause 1 second) anywhere. AI timing is approximate.",
                speakerHint: "For two voices, use Speaker1: and Speaker2: to choose who speaks each line.",
                sameVoiceError: "Choose two different voices for a dialogue.",
                speechRequired: "Add some spoken text along with your pause markers.",
                tryVoice: "Try Voice",
                generateVoice: "Generate Voice",
                soloPlaceholder: "Type your script here...",
                convPlaceholder: "Speaker1: Hello!\n(pause 2 seconds)\nSpeaker2: Hi!",
                timelinePos: "Timeline Position",
                download: "Export WAV",
                quotaError: "API Limit hit. Please wait a moment.",
                safetyError: "Blocked by safety filters.",
                genError: "Request failed.",
                refreshTooltip: "Refresh Control Board",
                refreshSafeMsg: "Click here won't affect your audio generation",
                none: "None (Default)"
            },
            vie: {
                freeVersion: "Phiên bản miễn phí",
                apiKeyLabel: "Khóa API của bạn",
                apiKeyLink: "Lấy khóa API (Google AI Studio)",
                apiKeyPlaceholder: "Dán khóa Free Tier của bạn ở đây...",
                keyRequired: "Vui lòng nhập khóa API Gemini của bạn trước.",
                voice1: "Giọng 1",
                voice2: "Giọng 2",
                style: "Tông giọng",
                speed: "Tốc độ",
                pauseHint: "Chèn (pause 2 seconds) hoặc (pause 1 second) ở vị trí cần nghỉ. Thời gian AI có thể chênh lệch.",
                speakerHint: "Với hai giọng, dùng Speaker1: và Speaker2: để chọn người đọc từng dòng.",
                sameVoiceError: "Hãy chọn hai giọng khác nhau cho hội thoại.",
                speechRequired: "Hãy thêm nội dung cần đọc bên cạnh các ký hiệu nghỉ.",
                tryVoice: "Thử giọng",
                generateVoice: "Tạo giọng",
                soloPlaceholder: "Nhập nội dung ở đây...",
                convPlaceholder: "Speaker1: Xin chào!\n(pause 2 seconds)\nSpeaker2: Chào bạn!",
                timelinePos: "Dòng thời gian",
                download: "Tải file .WAV",
                quotaError: "Bị giới hạn tốc độ. Vui lòng chờ.",
                safetyError: "Nội dung bị AI chặn.",
                genError: "Lỗi yêu cầu.",
                refreshTooltip: "Làm mới bảng điều khiển",
                refreshSafeMsg: "Bấm vào đây sẽ không ảnh hưởng đến âm thanh đã tạo",
                none: "Không (Mặc định)"
            }
        };

        const VOICES = [
            { id: "Zephyr", gender: "Woman" }, { id: "Puck", gender: "Man" },
            { id: "Charon", gender: "Man" }, { id: "Kore", gender: "Woman" },
            { id: "Fenrir", gender: "Man" }, { id: "Leda", gender: "Woman" },
            { id: "Orus", gender: "Man" }, { id: "Aoede", gender: "Woman" },
            { id: "Callirrhoe", gender: "Woman" }, { id: "Autonoe", gender: "Woman" },
            { id: "Enceladus", gender: "Man" }, { id: "Iapetus", gender: "Man" },
            { id: "Umbriel", gender: "Man" }, { id: "Algieba", gender: "Man" },
            { id: "Despina", gender: "Woman" }, { id: "Erinome", gender: "Woman" },
            { id: "Algenib", gender: "Man" }, { id: "Rasalgethi", gender: "Man" },
            { id: "Laomedeia", gender: "Woman" }, { id: "Achernar", gender: "Woman" },
            { id: "Alnilam", gender: "Man" }, { id: "Schedar", gender: "Man" },
            { id: "Gacrux", gender: "Woman" }, { id: "Pulcherrima", gender: "Man" },
            { id: "Achird", gender: "Man" }, { id: "Zubenelgenubi", gender: "Man" },
            { id: "Vindemiatrix", gender: "Woman" }, { id: "Sadachbia", gender: "Man" },
            { id: "Sadaltager", gender: "Man" }, { id: "Sulafat", gender: "Woman" }
        ];

        const App = () => {
            const [lang, setLang] = useState('eng');
            const [script, setScript] = useState('');
            const [speaker1, setSpeaker1] = useState('Zephyr');
            const [speaker2, setSpeaker2] = useState('None');
            const [style, setStyle] = useState('(Default)');
            const [speed, setSpeed] = useState(1.0);
            const [zoom, setZoom] = useState(40);
            const [userApiKey, setUserApiKey] = useState('');
            const cachedSpeechRef = useRef(null);
            const previewAudioRef = useRef(null);
            const generationInFlightRef = useRef(false);
            const [clips, setClips] = useState([]);
            const [status, setStatus] = useState('idle');
            const [errorMsg, setErrorMsg] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [showDownloadModal, setShowDownloadModal] = useState(false);
            const [exportFileName, setExportFileName] = useState('My_Voice_Sequence');

            // HIGH PERFORMANCE REFS: These kill the lag by avoiding state re-renders
            const currentTimeRef = useRef(0);
            const playheadRef = useRef(null);
            const timerRef = useRef(null);
            const timelineRef = useRef(null);
            const activePlayersRef = useRef(new Map()); 
            const lastTickRef = useRef(null);
            const requestRef = useRef(null);
            const [isDragging, setIsDragging] = useState(null);

            const activeApiKey = userApiKey.trim();
            const t = TRANSLATIONS[lang];
            const authorName = "by Lê Châu";

            const totalDuration = useMemo(() => 
                clips.length > 0 ? Math.max(...clips.map(c => c.startTime + c.duration)) : 0, 
            [clips]);

            const updateUI = useCallback((time) => {
                if (playheadRef.current) {
                    playheadRef.current.style.left = `${40 + time * zoom}px`;
                }
                if (timerRef.current) {
                    timerRef.current.innerText = new Date(time * 1000).toISOString().substr(14, 5);
                }
                if (timelineRef.current && isPlaying) {
                    const timeline = timelineRef.current;
                    const pos = 40 + time * zoom;
                    const width = timeline.clientWidth;
                    if (pos > timeline.scrollLeft + width * 0.8) {
                        timeline.scrollLeft = pos - width * 0.2;
                    }
                }
            }, [zoom, isPlaying]);

            useEffect(() => {
                updateUI(currentTimeRef.current);
            }, [zoom, updateUI]);

            const stopAllPlayers = useCallback(() => {
                activePlayersRef.current.forEach(audio => { audio.pause(); audio.src = ""; });
                activePlayersRef.current.clear();
            }, []);

            const animate = useCallback((time) => {
                if (lastTickRef.current !== null) {
                    const delta = (time - lastTickRef.current) / 1000;
                    currentTimeRef.current += delta;
                    const cur = currentTimeRef.current;

                    const activeClipsAtTime = clips.filter(c => cur >= c.startTime && cur <= c.startTime + c.duration);
                    
                    activeClipsAtTime.forEach(clip => {
                        if (!activePlayersRef.current.has(clip.id)) {
                            const audio = new Audio(clip.url);
                            audio.currentTime = Math.max(0, cur - clip.startTime);
                            audio.play().catch(() => {});
                            activePlayersRef.current.set(clip.id, audio);
                        }
                    });

                    activePlayersRef.current.forEach((audio, clipId) => {
                        const clip = clips.find(c => c.id === clipId);
                        if (!clip || cur < clip.startTime || cur > clip.startTime + clip.duration) {
                            audio.pause(); audio.src = ""; activePlayersRef.current.delete(clipId);
                        } else {
                            const ideal = (cur - clip.startTime);
                            if (Math.abs(audio.currentTime - ideal) > 0.15) audio.currentTime = ideal;
                        }
                    });

                    updateUI(cur);
                    
                    if (cur > totalDuration + 0.05) { 
                        setIsPlaying(false); 
                        return; 
                    }
                }
                lastTickRef.current = time; 
                requestRef.current = requestAnimationFrame(animate);
            }, [clips, totalDuration, zoom, updateUI]);

            useEffect(() => {
                if (isPlaying) { 
                    lastTickRef.current = null; 
                    requestRef.current = requestAnimationFrame(animate); 
                } else { 
                    cancelAnimationFrame(requestRef.current); 
                    stopAllPlayers();
                }
                return () => { cancelAnimationFrame(requestRef.current); stopAllPlayers(); };
            }, [isPlaying, animate, stopAllPlayers]);

            const handleTTS = async (saveToTimeline = false) => {
                if (!script.trim() || generationInFlightRef.current) return;
                if (!activeApiKey) { setErrorMsg(t.keyRequired); return; }
                generationInFlightRef.current = true;
                setStatus('generating');
                setErrorMsg(null);
                try {
                    let textToSend = script.trim();
                    const pausePattern = /\(\s*pause\s+(\d+(?:\.\d+)?)\s*seconds?\s*\)/gi;
                    const hasInlinePauses = /\(\s*pause\s+\d+(?:\.\d+)?\s*seconds?\s*\)/i.test(textToSend);
                    const spokenTextOnly = textToSend.replace(pausePattern, '').trim();
                    if (!spokenTextOnly) throw new Error(t.speechRequired);
                    textToSend = textToSend.replace(pausePattern, (_, seconds) => `(pause ${Number(seconds)} seconds)`);
                    const stylePrefix = style !== "(Default)" ? `Say in a ${style.toLowerCase()} tone: ` : "";
                    const speedPrefix = speed !== 1.0 ? `(Speak at ${speed}x speed) ` : "";
                    
                    let speechConfig;
                    if (speaker2 !== "None") {
                        if (speaker1 === speaker2) throw new Error(t.sameVoiceError);
                        const lines = textToSend.split('\n').filter(l => l.trim());
                        let nextSpeaker = 1;
                        textToSend = lines.map(l => {
                            // Standalone pause markers are stage directions, not speaker turns.
                            if (!l.replace(pausePattern, '').trim()) return l.trim();
                            const explicitSpeaker = l.match(/^\s*Speaker\s*([12])\s*:\s*/i);
                            const assignedSpeaker = explicitSpeaker ? Number(explicitSpeaker[1]) : nextSpeaker;
                            const spokenLine = explicitSpeaker ? l.slice(explicitSpeaker[0].length) : l.trim();
                            if (!spokenLine.trim()) return '';
                            nextSpeaker = assignedSpeaker === 1 ? 2 : 1;
                            return `Speaker${assignedSpeaker}: ${spokenLine}`;
                        }).join('\n');
                        speechConfig = { multiSpeakerVoiceConfig: { speakerVoiceConfigs: [speaker1, speaker2].map((voice, index) => ({ speaker: `Speaker${index + 1}`, voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } })) } };
                        const delivery = [style !== '(Default)' ? `Use a ${style.toLowerCase()} tone.` : '', speed !== 1 ? `Speak at ${speed}x speed.` : ''].filter(Boolean).join(' ');
                        textToSend = `Generate a dialogue with exactly two distinct speakers. Speaker1 uses the configured ${speaker1} voice, and Speaker2 uses the configured ${speaker2} voice. Keep each voice consistent throughout. Change speaker only at an explicit Speaker1: or Speaker2: label, never in the middle of a labeled turn. Read every word after a label with that speaker's voice. Do not read speaker labels or these instructions aloud. ${delivery}\n\nDialogue:\n${textToSend}`;
                    } else {
                        textToSend = `${speedPrefix}${stylePrefix}${textToSend}`;
                        speechConfig = { voiceConfig: { prebuiltVoiceConfig: { voiceName: speaker1 } } };
                    }

                    if (hasInlinePauses) {
                        textToSend = `Read only the spoken script below. Every parenthetical (pause N seconds) is a silent stage direction: stop speaking at that exact position and leave approximately N seconds of silence before continuing. Each marker has its own duration; honor every duration separately. Never read the pause markers or these instructions aloud. A pause-only line is not a speaker turn.\n\nSpoken script:\n${textToSend}`;
                    }
                    const payload = { 
                        contents: [{ parts: [{ text: textToSend }] }], 
                        generationConfig: { responseModalities: ["AUDIO"], speechConfig: speechConfig },
                        safetySettings: [
                            { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                            { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                        ],
                        model: MODEL_ID 
                    };

                    // Reuse the latest successful audio for an identical request and key.
                    const requestSignature = JSON.stringify([activeApiKey, payload]);
                    let speech = cachedSpeechRef.current;
                    if (!speech || speech.requestSignature !== requestSignature) {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:generateContent`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'x-goog-api-key': activeApiKey },
                            body: JSON.stringify(payload)
                        });
                        const result = await response.json();
                        if (!response.ok) throw new Error(result.error?.message || t.genError);
                        const candidate = result.candidates?.[0];
                        const audioPart = candidate?.content?.parts?.find(p => p.inlineData);
                        if (!audioPart?.inlineData?.data) {
                            if (candidate?.finishReason === 'SAFETY') throw new Error(t.safetyError);
                            throw new Error('No audio data returned from API.');
                        }
                        const audioData = audioPart.inlineData.data.replace(/\s/g, '');
                        const sampleRate = parseInt(audioPart.inlineData.mimeType?.match(/rate=(\d+)/)?.[1] || '24000');
                        const bin = atob(audioData);
                        const bytes = new Uint8Array(bin.length);
                        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                        if (!bytes.length || bytes.length % 2 !== 0 || !(sampleRate > 0)) {
                            throw new Error('Invalid audio data returned from API.');
                        }
                        const wavHeader = new ArrayBuffer(44);
                        const view = new DataView(wavHeader);
                        const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
                        writeStr(0, 'RIFF'); view.setUint32(4, 36 + bytes.length, true); writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
                        view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
                        view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
                        view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeStr(36, 'data'); view.setUint32(40, bytes.length, true);
                        speech = {
                            requestSignature,
                            blob: new Blob([wavHeader, bytes], { type: 'audio/wav' }),
                            duration: bytes.length / (sampleRate * 2)
                        };
                        cachedSpeechRef.current = speech;
                    }
                    if (previewAudioRef.current) {
                        previewAudioRef.current.audio.pause();
                        previewAudioRef.current.audio.src = '';
                        URL.revokeObjectURL(previewAudioRef.current.url);
                        previewAudioRef.current = null;
                    }
                    const url = URL.createObjectURL(speech.blob);
                    if (saveToTimeline) {
                        const start = totalDuration;
                        setClips(prev => [...prev, { id: Date.now(), url, duration: speech.duration, startTime: start, text: script.substring(0, 20) + '...' }]);
                        currentTimeRef.current = start;
                        updateUI(start);
                    } else {
                        const audio = new Audio(url);
                        previewAudioRef.current = { audio, url };
                        await audio.play();
                    }
                } catch (err) {
                    setErrorMsg(err.message);
                } finally {
                    generationInFlightRef.current = false;
                    setStatus('idle');
                }
            };


            const togglePlay = () => {
                if (!isPlaying && currentTimeRef.current >= totalDuration - 0.1) {
                    currentTimeRef.current = 0;
                    updateUI(0);
                }
                setIsPlaying(!isPlaying);
            };

            const handleResetControlBoard = () => {
                setSpeaker1('Zephyr');
                setSpeaker2('None');
                setStyle('(Default)');
                setSpeed(1.0);
                setScript('');
                setErrorMsg(null);
                setStatus('idle');
            };

            const downloadAll = async () => {
                if (clips.length === 0) return;
                setStatus('exporting');
                try {
                    const offline = await Tone.Offline(async () => {
                        for (const clip of clips) {
                            const res = await fetch(clip.url);
                            const ab = await res.arrayBuffer();
                            const buffer = await Tone.getContext().decodeAudioData(ab);
                            const player = new Tone.Player(buffer).toDestination();
                            player.start(clip.startTime);
                        }
                    }, totalDuration + 0.5);

                    const length = offline.length * 2 + 44;
                    const buffer = new ArrayBuffer(length);
                    const view = new DataView(buffer);
                    const writeStr = (off, s) => { for(let i=0; i<s.length; i++) view.setUint8(off+i, s.charCodeAt(i)); };
                    writeStr(0, 'RIFF'); view.setUint32(4, length - 8, true); writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
                    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
                    view.setUint32(24, offline.sampleRate, true); view.setUint32(28, offline.sampleRate * 2, true);
                    view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeStr(36, 'data'); view.setUint32(40, length - 44, true);
                    const samples = offline.getChannelData(0);
                    let offset = 44;
                    for (let i = 0; i < samples.length; i++, offset += 2) {
                        const s = Math.max(-1, Math.min(1, samples[i]));
                        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                    }
                    const blob = new Blob([buffer], { type: 'audio/wav' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${exportFileName}.wav`; a.click();
                } catch (e) { setErrorMsg("Export failed."); }
                setStatus('idle'); setShowDownloadModal(false);
            };

            const startDragging = (id, e) => { 
                e.stopPropagation(); 
                setIsDragging({ id, startX: e.clientX, initialStartTime: clips.find(c => c.id === id).startTime }); 
            };
            
            const onMouseMove = useCallback((e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - isDragging.startX; 
                setClips(prev => prev.map(c => c.id === isDragging.id ? { ...c, startTime: Math.max(0, isDragging.initialStartTime + (deltaX / zoom)) } : c));
            }, [isDragging, zoom]);

            useEffect(() => {
                const stopDragging = () => setIsDragging(null);
                if (isDragging) { window.addEventListener('mousemove', onMouseMove); window.addEventListener('mouseup', stopDragging); }
                else { window.removeEventListener('mousemove', onMouseMove); window.removeEventListener('mouseup', stopDragging); }
                return () => { window.removeEventListener('mousemove', onMouseMove); window.removeEventListener('mouseup', stopDragging); };
            }, [isDragging, onMouseMove]);

            const handleTimelineClick = (e) => {
                if (isDragging) return;
                const rect = timelineRef.current.getBoundingClientRect(); 
                const x = e.clientX - rect.left + timelineRef.current.scrollLeft;
                const newTime = Math.max(0, (x - 40) / zoom);
                currentTimeRef.current = newTime;
                updateUI(newTime);
                if (isPlaying) stopAllPlayers();
            };

            return (
                <div className="h-screen w-screen flex flex-col relative overflow-hidden text-slate-800 font-sans">
                    {/* STATIC BACKGROUND IMAGE (Performance Optimization) */}
                    <img src="https://res.cloudinary.com/dvtltywiu/image/upload/v1775491192/Untitled_design_24_w2dikk.png" className="absolute inset-0 z-0 w-full h-full object-cover" alt="Background" />
                    <div className="absolute inset-0 z-0 bg-white/20 backdrop-blur-[6px]" />

                    {/* Language Switcher */}
                    <div className="absolute top-6 left-10 z-[100] flex items-center gap-2 bg-white/60 backdrop-blur-xl p-1.5 rounded-full border border-white shadow-lg group transition-all hover:bg-white/90">
                        <div className="flex relative">
                            <div className={`absolute inset-0 w-1/2 bg-blue-600 rounded-full transition-transform duration-300 transform ${lang === 'vie' ? 'translate-x-full' : 'translate-x-0'}`} />
                            <button onClick={() => setLang('eng')} className={`relative z-10 px-4 py-1.5 text-[10px] font-black uppercase tracking-widest transition-colors ${lang === 'eng' ? 'text-white' : 'text-slate-400'}`}>Eng</button>
                            <button onClick={() => setLang('vie')} className={`relative z-10 px-4 py-1.5 text-[10px] font-black uppercase tracking-widest transition-colors ${lang === 'vie' ? 'text-white' : 'text-slate-400'}`}>Vie</button>
                        </div>
                    </div>

                    <div className="relative z-10 flex flex-col h-full overflow-hidden">
                        <div className="flex-grow flex items-start justify-center px-10 gap-8 min-h-0 pt-6">
                            <div className="flex flex-col items-center justify-start shrink-0 w-[24%] pt-24">
                                <img src="https://res.cloudinary.com/dzasncxfn/image/upload/v1774113280/Untitled_design_16_tumewc.png" alt="Speak it!" className="w-full max-w-[140px] object-contain drop-shadow-2xl animate-float" />
                                <div className="flex gap-[1px] relative z-[5] -mt-2 mb-16">
                                    {authorName.split("").map((char, index) => (
                                        <span key={index} className={`text-xl lg:text-3xl tracking-widest font-neon drop-shadow-md select-none neon-letter ${char === ' ' ? 'mx-2' : ''}`} style={{ animationDelay: `${index * 0.2}s` }}>{char}</span>
                                    ))}
                                </div>
                                <div className="w-full max-w-[280px] p-5 glass-card rounded-3xl border border-white/50 shadow-xl space-y-3">
                                    <div className="flex flex-col gap-1">
                                        <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest ml-3 flex items-center gap-2"><Icon name="key" size={12} strokeWidth={3} /> {t.apiKeyLabel}</label>
                                        <input type="password" value={userApiKey} onChange={e => setUserApiKey(e.target.value)} placeholder={t.apiKeyPlaceholder} className={`w-full h-10 px-4 bg-white/60 rounded-full text-xs font-bold outline-none border border-white focus:border-blue-300 transition-all text-slate-700 shadow-inner ${!userApiKey.trim() ? 'api-key-attention' : ''}`} />
                                    </div>
                                    <a href="https://aistudio.google.com/" target="_blank" rel="noopener noreferrer" className="text-[9px] font-black text-blue-600 hover:text-blue-800 uppercase tracking-widest flex items-center justify-center gap-2 transition-colors py-1 group"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="api-link-arrow"><path d="M3 12h17M14 5l7 7-7 7" /></svg><span>{t.apiKeyLink}</span> <Icon name="external" size={12} className="opacity-50 shrink-0" /></a>
                                    <a href="https://www.netlify.com/" target="_blank" rel="noopener noreferrer" className="block text-center text-[9px] text-slate-600 hover:text-blue-700">This site is powered by Netlify</a>
                                    <a href={FREE_VERSION_URL} className="flex items-center justify-center gap-2 w-full py-3 rounded-full bg-blue-600 text-white font-black text-[10px] uppercase tracking-widest shadow-lg hover:bg-blue-700">{t.freeVersion} →</a>
                                </div>
                            </div>

                            <div className="flex-grow h-full max-h-[540px] flex glass-panel rounded-[3.5rem] shadow-2xl border border-white/40 p-10 gap-10 overflow-hidden relative self-center">
                                <div className="w-[34%] flex flex-col gap-2 shrink-0 border-r border-slate-200/50 pr-10 justify-center relative">
                                    <div className="space-y-1"><label className="text-[10px] font-black text-slate-400 uppercase ml-4">{t.voice1}</label><select value={speaker1} onChange={e => setSpeaker1(e.target.value)} className="w-full bg-white/40 border border-white rounded-full h-11 px-5 font-bold text-xs outline-none hover:bg-white transition-all text-slate-700 appearance-none cursor-pointer">{VOICES.map(v => <option key={v.id} value={v.id}>{v.id} ({v.gender})</option>)}</select></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black text-slate-400 uppercase ml-4">{t.voice2}</label><select value={speaker2} onChange={e => setSpeaker2(e.target.value)} className="w-full bg-white/40 border border-white rounded-full h-11 px-5 font-bold text-xs outline-none hover:bg-white transition-all text-slate-700 appearance-none cursor-pointer"><option value="None">{t.none}</option>{VOICES.map(v => <option key={v.id} value={v.id}>{v.id} ({v.gender})</option>)}</select></div>
                                    <div className="space-y-1"><label className="text-[10px] font-black text-slate-400 uppercase ml-4">{t.style}</label><select value={style} onChange={e => setStyle(e.target.value)} className="w-full bg-white/40 border border-white rounded-full h-11 px-5 font-bold text-xs outline-none hover:bg-white transition-all text-slate-700 appearance-none cursor-pointer">{STYLES_LIST.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
                                    <div className="space-y-2 pt-2"><div className="flex justify-between text-[10px] font-black text-slate-400 uppercase px-4"><span>{t.speed}</span><span className="text-blue-600 font-bold">{speed.toFixed(1)}x</span></div><div className="h-8 flex items-center px-4"><input type="range" min="0.5" max="2.0" step="0.1" value={speed} onChange={(e) => setSpeed(parseFloat(e.target.value))} className="w-full" /></div></div>
                                    
                                    <div className="absolute -top-4 -right-4 flex flex-col items-end gap-2">
                                        {errorMsg && (
                                            <div className="bg-red-600 text-white text-[10px] font-black px-4 py-2 rounded-2xl shadow-xl animate-in fade-in slide-in-from-right-4 duration-300 whitespace-nowrap mb-1">
                                                {t.refreshSafeMsg}
                                                <div className="absolute -bottom-1 right-5 w-2 h-2 bg-red-600 rotate-45"></div>
                                            </div>
                                        )}
                                        <button 
                                            onClick={handleResetControlBoard} 
                                            title={t.refreshTooltip}
                                            className={`w-10 h-10 bg-white/80 border rounded-full shadow-lg flex items-center justify-center transition-all active:scale-90 ${errorMsg ? 'animate-emergency border-red-500 text-red-600' : 'border-white text-slate-400 hover:text-blue-500 hover:shadow-blue-200/50'}`}
                                        >
                                            <Icon name="refresh" size={18} />
                                        </button>
                                    </div>
                                </div>
                                <div className="flex-grow flex flex-col min-w-0">
                                    <div className="flex-grow relative min-h-0">
                                        <textarea value={script} onChange={e => setScript(e.target.value)} aria-describedby="inline-pause-hint" className="w-full h-full bg-white/30 border border-white rounded-[2.5rem] p-8 text-lg font-medium outline-none focus:bg-white/50 transition-all shadow-inner resize-none no-scrollbar placeholder-slate-400" placeholder={speaker2 === "None" ? t.soloPlaceholder : t.convPlaceholder} />
                                        <button onClick={() => setScript("")} className="absolute bottom-6 right-6 w-11 h-11 flex items-center justify-center text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-full transition-all active:scale-90"><Icon name="trash" size={24} /></button>
                                    </div>
                                    <p id="inline-pause-hint" className="mt-3 px-4 text-[10px] font-semibold text-slate-500 shrink-0">{t.pauseHint}</p>
                                    {speaker2 !== 'None' && <p className="mt-1 px-4 text-[10px] font-semibold text-blue-600 shrink-0">{t.speakerHint}</p>}
                                    <div className="mt-3 flex gap-4 shrink-0">
                                        <button onClick={() => handleTTS(false)} disabled={status === 'generating'} className="flex-1 h-14 rounded-full bg-white/50 text-slate-600 font-black text-[10px] uppercase tracking-widest flex items-center justify-center gap-3 hover:bg-white transition-all border border-white active:scale-95 disabled:opacity-50">{status === 'generating' ? <Icon name="loader" /> : <Icon name="mic" />} {t.tryVoice}</button>
                                        <button onClick={() => handleTTS(true)} disabled={status === 'generating'} className="flex-[2] h-14 rounded-full bg-blue-600 text-white font-black text-[10px] uppercase tracking-widest flex items-center justify-center gap-3 hover:bg-blue-700 shadow-xl active:scale-95 disabled:opacity-50">{status === 'generating' ? <Icon name="loader" /> : <Icon name="check" />} {t.generateVoice}</button>
                                    </div>
                                    {errorMsg && <div className="mt-4 flex items-center gap-3 text-red-500 text-[10px] font-black bg-red-50/50 p-3 rounded-2xl border border-red-200 shrink-0 animate-pulse"><Icon name="alert" size={16} /> {errorMsg} <a href={FREE_VERSION_URL} className="underline ml-auto whitespace-nowrap">{t.freeVersion} →</a></div>}
                                </div>
                            </div>
                        </div>

                        <div className="shrink-0 w-full px-8 pb-8 space-y-4 z-[30]">
                            <div className="flex items-center justify-end px-10">
                                <div className="flex items-center gap-4">
                                    <button onClick={() => setShowDownloadModal(true)} disabled={clips.length === 0} className="h-12 px-10 bg-slate-800 text-white rounded-full font-black text-[10px] uppercase tracking-widest flex items-center gap-3 shadow-xl hover:bg-slate-900 transition-all active:scale-95">
                                        <Icon name="download" size={18} /> {t.download}
                                    </button>
                                    <div className="flex bg-white/60 p-1 rounded-full border border-white shadow-sm">
                                        <button onClick={() => setZoom(z => Math.max(10, z - 10))} className="p-2 text-slate-400 hover:text-slate-800 transition-all"><Icon name="zoomOut" size={18} /></button>
                                        <button onClick={() => setZoom(z => Math.min(100, z + 10))} className="p-2 text-slate-400 hover:text-slate-800 transition-all"><Icon name="zoomIn" size={18} /></button>
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="flex w-16 shrink-0 flex-col items-center gap-2">
                                    <button onClick={togglePlay} aria-label={isPlaying ? 'Pause timeline' : 'Play timeline'} className="w-16 h-16 glass-card border border-white text-blue-600 rounded-full flex items-center justify-center shadow-2xl active:scale-95 transition-all">{isPlaying ? <Icon name="pause" size={32} /> : <Icon name="play" size={32} className="ml-1" />}</button>
                                    <div className="text-xl font-black text-slate-800 tabular-nums"><span ref={timerRef}>00:00</span></div>
                                </div>
                            <div className="relative h-32 flex-1 min-w-0 glass-panel rounded-[2.5rem] border border-white/30 shadow-2xl flex flex-col pt-8 overflow-hidden">
                                <div ref={timelineRef} onClick={handleTimelineClick} className="relative flex-grow cursor-crosshair overflow-x-auto timeline-scroll scroll-smooth overflow-y-hidden">
                                    <div className="relative h-full flex items-center" style={{ minWidth: `${Math.max(window.innerWidth, (totalDuration + 60) * zoom + 100)}px` }}>
                                        <div className="absolute top-0 left-0 right-0 h-8 border-b border-slate-200/20 flex items-center pointer-events-none">
                                            {[...Array(Math.ceil(totalDuration + 120))].map((_, i) => (
                                                <div key={i} data-timeline-second={i} className="absolute h-full flex flex-col items-center" style={{ left: `${40 + i * zoom}px`, transform: 'translateX(-50%)' }}>
                                                    <span className="text-[8px] font-bold text-slate-500 mb-1 select-none">{i}s</span>
                                                    <div className="w-[1px] h-2 bg-slate-400/30" />
                                                </div>
                                            ))}
                                        </div>
                                        <div id="playhead" ref={playheadRef} className="absolute top-0 bottom-0 w-[2.5px] bg-red-600 z-10 shadow-[0_0_15px_rgba(220,38,38,0.8)] pointer-events-none" style={{ left: `40px` }} />
                                        <div className="relative h-14 w-full">
                                            {clips.map((clip) => (
                                                <div key={clip.id} data-clip-start={clip.startTime} onMouseDown={(e) => startDragging(clip.id, e)} className={`absolute h-14 rounded-2xl flex items-center px-5 border-2 group transition-[border-color,box-shadow] cursor-move border-white bg-white/60 text-slate-500 hover:border-blue-400 hover:shadow-lg`} style={{ left: `${40 + clip.startTime * zoom}px`, width: `${clip.duration * zoom}px` }}>
                                                    <div className="flex items-center gap-3 overflow-hidden select-none">
                                                        <Icon name="waves" size={14} className="text-blue-400" />
                                                        <span className="text-[10px] font-black truncate uppercase tracking-tighter">{clip.text}</span>
                                                    </div>
                                                    <button onClick={(e) => { e.stopPropagation(); setClips(clips.filter(c => c.id !== clip.id)); }} className="absolute -top-2 -right-2 w-7 h-7 bg-red-500 text-white rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 shadow-xl transition-all hover:scale-110"><Icon name="x" size={12} /></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            </div>
                        </div>
                    </div>

                    {showDownloadModal && (
                        <div className="fixed inset-0 z-[1000] flex items-center justify-center p-6">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-md" onClick={() => setShowDownloadModal(false)} />
                            <div className="relative w-full max-w-md bg-white rounded-[3rem] border border-white shadow-2xl p-10 flex flex-col items-center gap-8 animate-in fade-in zoom-in-95">
                                <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center shadow-inner"><Icon name="download" size={32} /></div>
                                <div className="text-center space-y-2"><h3 className="text-2xl font-black text-slate-800">{t.readyExport}</h3><p className="text-sm font-bold text-slate-400 uppercase tracking-widest flex items-center justify-center gap-2"><Icon name="clock" size={14} /> {totalDuration.toFixed(1)}s</p></div>
                                <div className="w-full space-y-3"><label className="text-[10px] font-black text-slate-400 uppercase ml-4">{t.nameFile}</label><input type="text" autoFocus value={exportFileName} onChange={(e) => setExportFileName(e.target.value)} className="w-full h-16 px-8 bg-slate-50 border border-slate-200 rounded-full text-sm font-bold outline-none focus:ring-4 focus:ring-blue-100 transition-all text-slate-700" /></div>
                                <div className="flex gap-4 w-full pt-4"><button onClick={() => setShowDownloadModal(false)} className="flex-1 h-14 rounded-full bg-slate-100 text-slate-500 font-black text-xs uppercase hover:bg-slate-200 transition-all">{t.cancel}</button><button onClick={downloadAll} disabled={status === 'exporting'} className="flex-[2] h-14 rounded-full bg-blue-600 text-white font-black text-xs uppercase tracking-widest hover:bg-blue-700 shadow-xl transition-all">
                                    {status === 'exporting' ? t.merging : t.download}
                                </button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
