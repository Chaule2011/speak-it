<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speak It! · Azure</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%232563eb'/%3E%3Cpath d='M12 8v16l13-8z' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script defer src="core.js"></script><script defer src="app.js"></script></head>
<body><img class="background" alt="" src="https://res.cloudinary.com/dvtltywiu/image/upload/v1775491192/Untitled_design_24_w2dikk.png"><div class="background-glass"></div>
<div class="language"><button id="eng" aria-pressed="true">ENG</button><button id="vie" aria-pressed="false">VIE</button></div>
<main><div class="studio"><aside class="identity"><img class="logo" alt="Speak it!" src="https://res.cloudinary.com/dzasncxfn/image/upload/v1774113280/Untitled_design_16_tumewc.png"><div class="author">by Lê Châu</div><a class="netlify-attribution" href="https://www.netlify.com/" target="_blank" rel="noopener noreferrer">This site is powered by Netlify</a><button id="connect" hidden class="azure-status" title="Reconnect Azure"><span id="connection-status">Connecting Azure…</span></button></aside>
<section class="card editor"><div class="voice-controls"><label for="voice1" data-en="Voice 1" data-vi="Giọng 1">Voice 1</label><select id="voice1"></select><label for="voice2" data-en="Voice 2" data-vi="Giọng 2">Voice 2</label><select id="voice2"></select><label for="style" data-en="Style" data-vi="Tông giọng">Style</label><select id="style"><option value="default">Default</option></select><p id="style-hint" class="style-note"></p><label for="speed" class="speed-label"><span data-en="Speed" data-vi="Tốc độ">Speed</span><output id="speed-value">1.0×</output></label><input id="speed" type="range" min="0.5" max="2" value="1" step="0.1"><button id="reset" class="reset" title="Reset controls, keep audio clips" aria-label="Reset controls"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-15-7L3 8M3 3v5h5M3 12a9 9 0 0 0 15 7l3-3m0 5v-5h-5"/></svg></button></div>
<div class="script-column"><div class="script-box"><textarea id="script" aria-label="Your script" placeholder="Type your script here…" spellcheck="true"></textarea><button id="clear" aria-label="Clear script" title="Clear script"><svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14H5V6M8 6V3h8v3m-6 4v7m4-7v7"/></svg></button></div><p class="pause-hint" data-en="Add (pause 2 seconds) or (pause 1 second) anywhere." data-vi="Chèn (pause 2 seconds) hoặc (pause 1 second) ở vị trí cần nghỉ.">Add (pause 2 seconds) or (pause 1 second) anywhere.</p><div class="actions"><button id="try" class="secondary" data-en="♩ Try Voice" data-vi="♩ Thử giọng">♩ Try Voice</button><button id="generate" class="primary" data-en="✓ Generate Voice" data-vi="✓ Tạo giọng">✓ Generate Voice</button></div><div id="message" role="status" class="message"></div></div></section></div>
<section class="timeline-section"><div class="timeline-tools"><button id="export" class="dark" disabled data-en="↓ Export WAV" data-vi="↓ Xuất WAV">↓ Export WAV</button><div class="zoom-group"><button id="zoom-out" class="icon-button" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6M7 10h6"/></svg></button><button id="zoom-in" class="icon-button" aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6M7 10h6m-3-3v6"/></svg></button></div></div><div class="timeline-row"><div class="play-column"><button id="play" aria-label="Play timeline" class="play" disabled>▷</button><output id="timer">00:00</output></div><div id="timeline" class="card timeline" tabindex="0" aria-label="Audio timeline"><div id="track"><div id="ruler"></div><div id="clips"></div><div id="playhead"></div><p id="empty"></p></div></div></div></section></main>
<div hidden><input id="key"><input id="region" value="eastus"><span id="count"></span><span id="session-usage"></span><span id="clip-count"></span><button id="example"></button></div>
<dialog id="export-dialog"><form method="dialog"><h2 data-en="Export WAV" data-vi="Xuất WAV">Export WAV</h2><label for="filename" data-en="File name" data-vi="Tên tệp">File name</label><input id="filename" value="My_Azure_Listening_Test"><div class="actions"><button value="cancel" class="secondary">Cancel</button><button id="save-wav" type="button" class="primary">Download WAV</button></div></form></dialog></body></html>
